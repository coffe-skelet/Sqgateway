<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squeeze Gateway — Login</title>
  <meta name="description" content="Login to Squeeze Gateway">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            'primary': 'var(--color-primary)',
            'on-primary': 'var(--color-on-primary)',
            'secondary': 'var(--color-secondary)',
            'background': 'var(--color-background)',
            'surface': 'var(--color-surface)',
            'on-surface': 'var(--color-on-surface)',
            'surface-container': 'var(--color-surface-container)',
            'surface-container-low': 'var(--color-surface-container-low)',
            'surface-container-high': 'var(--color-surface-container-high)',
            'outline': 'var(--color-outline)',
            'outline-variant': 'var(--color-outline-variant)',
            'on-surface-variant': 'var(--color-on-surface-variant)',
          }
        }
      }
    }
  </script>
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2c; border-radius: 4px; }

    .light {
      --primary: #2f3131;
      --on-primary: #ffffff;
      --background: #fafafa;
      --on-background: #1c1b1d;
      --surface: #ffffff;
      --on-surface: #1c1b1d;
      --surface-container: #f3f3f4;
      --surface-container-low: #f7f7f8;
      --surface-container-lowest: #ffffff;
      --surface-container-high: #ededee;
      --on-surface-variant: #44474a;
      --outline: #74777a;
    }
  </style>
</head>
<body class="bg-background font-body text-on-surface antialiased" data-page="login">

<header class="fixed top-0 left-0 right-0 z-50 bg-surface/95 backdrop-blur-md border-b border-surface-container-high">
  <div class="h-16 w-full px-6 lg:px-12 flex items-center justify-between gap-4">
    <div class="flex items-center gap-6">
      <a class="flex items-center gap-2 group" href="index.html">
        <div class="w-7 h-7 bg-primary flex items-center justify-center text-on-primary font-bold text-sm transition-transform group-hover:scale-95">SQ</div>
        <div class="flex flex-col">
          <span class="font-semibold text-sm text-primary tracking-tight">Squeeze Gateway</span>
          <span class="text-[10px] text-outline-variant font-mono uppercase tracking-wider -mt-0.5">@kirill_skoch/v0.3</span>
        </div>
      </a>
    </div>
    <div class="flex items-center gap-4">
      <button id="theme-toggle" class="px-2 py-1.5 text-xs font-mono uppercase tracking-wider text-primary hover:bg-surface-container border border-surface-container-high transition-all flex items-center gap-1.5">
        <span class="material-symbols-outlined text-sm" id="theme-icon">light_mode</span>
        <span class="hidden sm:inline" id="theme-label">Light</span>
      </button>
    </div>
  </div>
</header>

<main class="w-full pt-16 bg-surface min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md px-6 py-12">

    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-primary flex items-center justify-center text-on-primary font-bold text-3xl mx-auto mb-4">
        SQ
      </div>
      <h1 class="text-3xl text-primary font-bold uppercase tracking-tight font-display mb-2">
        Login
      </h1>
      <p class="text-sm text-on-surface-variant">Access your Squeeze Gateway dashboard</p>
    </div>

    <div class="bg-surface-container-low border border-surface-container-high rounded-lg p-6">
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-mono text-outline uppercase tracking-wider mb-2" for="email">
            Email / Username
          </label>
          <input
            type="text"
            id="email"
            class="w-full bg-surface-container border border-surface-container-high rounded px-4 py-3 text-sm text-on-surface focus:outline-none focus:border-primary transition-colors"
            placeholder="your@email.com"
            required
          >
        </div>

        <div>
          <label class="block text-xs font-mono text-outline uppercase tracking-wider mb-2" for="password">
            Password
          </label>
          <input
            type="password"
            id="password"
            class="w-full bg-surface-container border border-surface-container-high rounded px-4 py-3 text-sm text-on-surface focus:outline-none focus:border-primary transition-colors"
            placeholder="••••••••"
            required
          >
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-on-surface-variant cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 bg-surface-container border border-surface-container-high rounded">
            <span>Remember me</span>
          </label>
          <a href="#" class="text-primary hover:underline">Forgot password?</a>
        </div>

        <button
          type="submit"
          class="w-full px-6 py-3.5 bg-primary text-on-primary font-semibold text-sm uppercase tracking-wider transition-all hover:bg-surface-container-highest hover:text-primary shadow-md"
        >
          Login
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-surface-container-high text-center">
        <p class="text-xs text-on-surface-variant">
          Don't have an account?
          <a href="#" class="text-primary hover:underline font-semibold">Sign up</a>
        </p>
      </div>

      <div class="mt-6 space-y-2">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-surface-container-high"></div>
          </div>
          <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-surface-container-low px-2 text-outline font-mono">Or continue with</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button id="google-login" class="px-4 py-2.5 bg-surface-container border border-surface-container-high rounded text-sm text-on-surface hover:bg-surface-container-high transition-colors flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Google</span>
          </button>
          <button id="github-login" class="px-4 py-2.5 bg-surface-container border border-surface-container-high rounded text-sm text-on-surface hover:bg-surface-container-high transition-colors flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            <span>GitHub</span>
          </button>
        </div>

        <div id="oauth-status" class="text-xs text-center text-outline-variant font-mono mt-2 hidden">
          Checking OAuth configuration...
        </div>
      </div>
    </div>

    <div class="mt-6 text-center">
      <p class="text-xs font-mono text-outline-variant">
        Demo Mode: Any credentials will work for testing
      </p>
    </div>

  </div>
</main>

<footer class="w-full bg-surface-container-lowest border-t border-surface-container-high">
  <div class="w-full px-6 lg:px-12 py-8">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
      <span class="text-xs font-mono text-on-surface-variant">Squeeze Gateway © 2026 • MIT License</span>
      <div class="flex items-center gap-6">
        <a href="index.html" class="text-xs font-mono text-on-surface-variant hover:text-primary transition-colors uppercase">Home</a>
        <a href="docs.html" class="text-xs font-mono text-on-surface-variant hover:text-primary transition-colors uppercase">Docs</a>
      </div>
    </div>
  </div>
</footer>

<script src="assets/app.js"></script>
<script>
  // Check for OAuth error in URL
  const urlParams = new URLSearchParams(window.location.search);
  const error = urlParams.get('error');
  if (error) {
    const errorMsg = error === 'google_auth_failed' ? 'Google authentication failed. Please try again.' :
                     error === 'github_auth_failed' ? 'GitHub authentication failed. Please try again.' :
                     'Authentication failed. Please try again.';
    alert(errorMsg);
  }

  // Check OAuth status
  async function checkOAuthStatus() {
    try {
      const response = await fetch('/auth/status');
      const data = await response.json();

      const googleBtn = document.getElementById('google-login');
      const githubBtn = document.getElementById('github-login');
      const statusDiv = document.getElementById('oauth-status');

      if (!data.google_enabled) {
        googleBtn.disabled = true;
        googleBtn.classList.add('opacity-50', 'cursor-not-allowed');
        googleBtn.title = 'Google OAuth not configured';
      }

      if (!data.github_enabled) {
        githubBtn.disabled = true;
        githubBtn.classList.add('opacity-50', 'cursor-not-allowed');
        githubBtn.title = 'GitHub OAuth not configured';
      }

      if (!data.google_enabled && !data.github_enabled) {
        statusDiv.textContent = 'OAuth not configured. Use demo login or configure OAuth in .env';
        statusDiv.classList.remove('hidden');
      }
    } catch (err) {
      console.error('Failed to check OAuth status:', err);
    }
  }

  // Google OAuth
  document.getElementById('google-login').addEventListener('click', function() {
    if (!this.disabled) {
      window.location.href = '/auth/google';
    }
  });

  // GitHub OAuth
  document.getElementById('github-login').addEventListener('click', function() {
    if (!this.disabled) {
      window.location.href = '/auth/github';
    }
  });

  // Demo login form
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const remember = document.getElementById('remember').checked;

    // Store user session (demo mode)
    localStorage.setItem('sqg_user', JSON.stringify({
      email,
      loggedIn: true,
      provider: 'demo',
      name: email.split('@')[0]
    }));

    // Redirect to profile
    window.location.href = 'profile.html';
  });

  // Check OAuth status on page load
  checkOAuthStatus();
</script>
</body>
</html>
