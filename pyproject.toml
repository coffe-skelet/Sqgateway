[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squeeze-gateway"
version = "0.3.0"
description = "LLM Token Optimization Gateway - Reduce token consumption by 30-60% without quality loss"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kirill Skoch", email = "kirill.skoch@example.com"}
]
keywords = ["llm", "optimization", "gateway", "tokens", "gemini", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/kirill-skoch/squeeze-gateway"
Documentation = "https://github.com/kirill-skoch/squeeze-gateway#readme"
Repository = "https://github.com/kirill-skoch/squeeze-gateway"
Issues = "https://github.com/kirill-skoch/squeeze-gateway/issues"

[project.scripts]
sqz = "sqz_cli.main:main"

[tool.setuptools]
packages = ["sqz_cli"]

[tool.setuptools.package-data]
sqz_cli = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
